<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Relógio - Horário de Brasília</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #clock {
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: #FFF;
    font-size: 20vw;
    line-height: 1;
    text-shadow: 0 0 20px rgba(250, 250, 250, 0.6);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div id="clock">--:--</div>

<script>
  function atualizarRelogio() {
    const agora = new Date();

    // Horário de Brasília (America/Sao_Paulo) via Intl
    const horas = new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      hour: '2-digit',
      hour12: false
    }).format(agora);

    const minutos = new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      minute: '2-digit'
    }).format(agora).padStart(2, '0');

    document.getElementById('clock').textContent = `${horas}:${minutos}`;
  }

  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);
</script>

</body>
</html>
